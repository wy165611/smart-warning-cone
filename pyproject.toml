[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-cone"
version = "0.2.0"
description = "哨兵 · 公路养护作业区智能预警锥桶系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
radar = ["pyserial>=3.5"]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["competition"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"server/app.py" = ["E402"]
"tools/simulator.py" = ["E402"]
"tools/radar_monitor.py" = ["E402"]
"sentinel/api.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]
# 仓库用 ruff format 排版，行宽与 black 对齐。
